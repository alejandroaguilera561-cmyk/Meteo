<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRONÓSTICO-ZAP</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<div id="lluvia"></div>

<header>
    <h1>🌦 PRONÓSTICO-ZAP</h1>
    <p>Estación Meteorológica Inteligente</p>
</header>

<div class="contenedor">

    <div class="principal">
        <h2 id="ciudad">Cargando...</h2>

        <div class="temperatura">
            <span id="temp">--</span>°C
        </div>

        <div id="estado">
            Obteniendo datos...
        </div>
    </div>

    <div class="grid">

        <div class="card">
            <h3>💧 Humedad</h3>
            <p id="humedad">-- %</p>
        </div>

        <div class="card">
            <h3>🌬 Viento</h3>
            <p id="viento">-- km/h</p>
        </div>

        <div class="card">
            <h3>☀ Índice UV</h3>
            <p id="uv">--</p>
        </div>

        <div class="card">
            <h3>🌧 Lluvia</h3>
            <p id="lluviaProb">-- %</p>
        </div>

    </div>

    <section class="grafico">
        <h2>📈 Temperatura de hoy</h2>
        <canvas id="graficoTemp"></canvas>
    </section>

    <section>
        <h2>📅 Pronóstico 7 días</h2>
        <div id="pronostico" class="pronostico"></div>
    </section>

</div>

<footer>
PRONÓSTICO-ZAP v3.0
</footer>

<script src="app.js"></script>

</body>
</html>
